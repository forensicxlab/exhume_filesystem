[package]
name = "exhume_filesystem"
version = "0.5.4"
edition = "2024"
description = "This exhume module is proposing a standard abstraction layer of a FileSystem, File and Directory for any exhume filesystem modules (extfs, ...)."
documentation = "https://www.forensicxlab.com/docs/category/exhume---filesystem"
repository = "https://github.com/forensicxlab/exhume_filesystem"
readme = "README.md"
authors = ["k1nd0ne"]
license = "GPL-3.0-only"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
exhume_body = "=0.5.7"
exhume_extfs = "=0.1.18"
exhume_ntfs = "=0.1.18"
exhume_exfat = "=0.1.12"
exhume_apfs = "=0.1.8"
exhume_partitions = "=0.3.12"

#exhume_extfs = { path = "../exhume_extfs", version = "=0.1.13" }
#exhume_ntfs = { path = "../exhume_ntfs", version = "=0.1.13" }
#exhume_exfat = { path = "../exhume_exfat", version = "=0.1.7" }
#exhume_apfs = { path = "../exhume_apfs", version = "=0.1.2" }

# We will propose LVM on top of the filesystem later
#exhume_lvm = { path = "../exhume_lvm" }
log = "0.4.25"
clap = { version = "4.5", features = ["cargo"] }
clap-num = "1.1.1"
env_logger = "0.11.6"
sqlx = { version = "0.8.6", features = [
    "sqlite",
    "runtime-tokio-native-tls",
    "macros",
] }
hex = "0.4.3"
fs2 = "0.4"
libc = "0.2"
same-file = "1"
sha2 = "0.10"
signal-hook = "0.3"
unicode-normalization = "0.1"
unicode-casefold = "0.2"
zeroize = "1"
flate2 = "1"
lzfse_rust = "0.2"
lzvn = { package = "lzvn-core", version = "0.1" }

# sha2-asm supports non-Windows x86/x86_64/aarch64 only. Other targets retain
# RustCrypto's portable backend instead of failing to compile.
[target.'cfg(all(not(target_os = "windows"), any(target_arch = "x86", target_arch = "x86_64", target_arch = "aarch64")))'.dependencies]
sha2 = { version = "0.10", features = ["asm"] }

[dev-dependencies]
tempfile = "3.26.0"
